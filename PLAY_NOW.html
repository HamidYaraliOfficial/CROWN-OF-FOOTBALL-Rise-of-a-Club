function squadRows(){const sq=roster().filter(p=>(filterPos==='ALL'||p.position===filterPos)&&`${p.name} ${p.nationality}`.toLowerCase().includes(query.toLowerCase()));return sq.map(p=>`<tr><td><div class="playername"><div class="avatar">${initials(p.name)}</div><div><b>${esc(p.name)}</b><small>${p.nationality}${p.youth?' · U21':''}</small></div></div></td><td><span class="pos">${p.position}</span></td><td>${p.age}</td><td><span class="rating">${p.overall}</span></td><td class="${p.potential>p.overall+10?'good':''}">${p.potential}</td><td>${p.fitness}%</td><td>${p.morale}%</td><td>${money(p.value)}</td><td><button class="btn outline" data-action="sell:${p.id}" ${sq.length<=18?'disabled':''}>${tr('sell')}</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">${tr('searchNo')}</td></tr>`}
function marketPlayers(){return state.players.filter(p=>p.clubId!==state.currentClubId).filter(p=>marketFilter==='free'?p.clubId==='free-agent':marketFilter==='value'?p.value<=5e6:true).filter(p=>filterPos==='ALL'||p.position===filterPos).filter(p=>`${p.name} ${p.nationality}`.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.overall-a.overall)}

function currentSquadTop(clubId){return state.players.filter(p=>p.clubId===clubId).sort((a,b)=>b.overall-a.overall).slice(0,11)}
function simulate(home,away,hp,ap,seed){const r=rng(seed>>>0);const atk=ps=>{const x=ps.filter(p=>p.position!=='GK');return avg(x.map(p=>(['ST','LW','RW','AM','CM'].includes(p.position)?p.shooting*.35+p.passing*.25+p.overall*.4:p.overall)*(.65+p.fitness/260)))};const def=ps=>avg(ps.filter(p=>['GK','CB','LB','RB','DM'].includes(p.position)).map(p=>(p.position==='GK'?p.goalkeeping:p.defending)*(.7+p.fitness/340)));const ha=atk(hp)+3,aa=atk(ap),hd=def(hp),ad=def(ap);const homePoss=Math.max(31,Math.min(69,Math.round(50+(ha-aa)*.42+(state.tactics.style==='possession'&&home.id===state.currentClubId?5:0)+(r()-.5)*10)));const hs=Math.max(4,Math.min(25,Math.round(9+r()*9+(ha-ad)*.1+(home.id===state.currentClubId?(state.tactics.tempo-50)*.035:0)))),as=Math.max(4,Math.min(25,Math.round(9+r()*9+(aa-hd)*.1)));const events=[];let hg=0,ag=0,hot=0,aot=0,hx=0,ax=0;function side(club,opponent,ps,shots,attack,defense,isHome){const shooters=ps.filter(p=>p.position!=='GK'&&p.injuredWeeks===0);for(let i=0;i<shots;i++){const minute=3+Math.floor(r()*87),p=shooters[Math.floor(r()*Math.max(1,shooters.length))]||ps[0],xg=Math.max(.025,Math.min(.36,.045+r()*.19+(attack-defense)*.0009)),on=r()<Math.min(.8,.27+p.shooting/180),goal=on&&r()<Math.max(.008,Math.min(.55,xg*Math.max(.62,Math.min(1.42,1+(attack-defense)/115))*(isHome&&club.id===state.currentClubId&&state.tactics.mentality==='attacking'?1.1:1)));if(on){if(isHome)hot++;else aot++}if(isHome)hx+=xg;else ax+=xg;const x=isHome?-.98+r()*.42:.56+r()*.42,z=-.82+r()*1.64;events.push({minute,type:'shot',teamId:club.id,playerId:p.id,text:`${p.name} — ${goal?'GOAL':on?'shot on target':'shot wide'}`,x,z,targetX:isHome?.96:-.96,targetZ:(r()-.5)*.2,xg:+xg.toFixed(2)});if(goal){if(isHome)hg++;else ag++;const a=shooters.filter(q=>q.id!==p.id&&['CM','AM','LW','RW','ST'].includes(q.position));const assist=a.length&&r()>.18?a[Math.floor(r()*a.length)]:null;events.push({minute,type:'goal',teamId:club.id,playerId:p.id,assistId:assist?.id,text:`GOAL! ${p.name}${assist?' (assist: '+assist.name+')':''}`,x,z,targetX:isHome?.96:-.96,targetZ:(r()-.5)*.12,xg:+xg.toFixed(2)})}}for(let i=0;i<Math.round(3+r()*7);i++){const minute=2+Math.floor(r()*88),roll=r(),type=roll<.16?'yellow':roll<.55?'foul':'corner';events.push({minute,type,teamId:club.id,text:type==='yellow'?'Yellow card':type==='foul'?'Foul':'Corner kick',x:(r()-.5)*1.7,z:(r()-.5)*1.7,targetX:(r()-.5),targetZ:(r()-.5)})}}side(home,away,hp,hs,ha,ad,true);side(away,home,ap,as,aa,hd,false);events.sort((a,b)=>a.minute-b.minute||(a.type==='goal'?-1:1));return{homeGoals:hg,awayGoals:ag,homeShots:hs,awayShots:as,homeOnTarget:hot,awayOnTarget:aot,homePossession:homePoss,awayPossession:100-homePoss,homeXg:+hx.toFixed(2),awayXg:+ax.toFixed(2),events,seed}}
function getMatchTeams(){const f=matchRun?state.fixtures.find(x=>x.id===matchRun.fixtureId)||currentFixture():currentFixture();const h=f?state.clubs.find(x=>x.id===f.homeClubId):club(),a=f?state.clubs.find(x=>x.id===f.awayClubId):club();return{f,h,a}}

ession,'%'],[tr('shots'),r.homeShots,r.awayShots,''],[tr('target'),r.homeOnTarget,r.awayOnTarget,''],[tr('xg'),r.homeXg,r.awayXg,'']].map(([lab,hv,av,suf])=>`<div class="statrow"><span>${lab}</span><b>${hv}${suf}</b><div class="duobar"><i style="width:${Number(hv)/(Number(hv)+Number(av)||1)*100}%"></i><i style="width:${Number(av)/(Number(hv)+Number(av)||1)*100}%"></i></div><b>${av}${suf}</b></div>`).join('')}</div><div class="panel">${panelHead('EVENT FEED',tr('events'))}<div id="event-feed">${renderEvents(r,matchRun?.progress??90)}</div></div></div>`:''}`}
function renderEvents(r,progress){return r.events.filter(e=>e.minute<=progress).slice(-9).reverse().map(e=>`<div class="event"><b>${e.minute}'</b><span style="color:${e.type==='goal'?'#e4c678':'#7fa28a'}">${e.type==='goal'?'⚽':e.type==='yellow'?'▰':e.type==='save'?'▣':'·'}</span><span>${esc(e.text)}${e.xg!==undefined?` <small class="muted">${e.xg} xG</small>`:''}</span></div>`).join('')||`<div class="empty">${tr('events')}</div>`}
let pitchCtx=null;function initPitch(){const cv=document.getElementById('pitch-canvas');if(!cv)return;const ctx=cv.getContext('2d');if(!ctx)return;pitchCtx={cv,ctx};drawPitch();}
function drawPitch(){if(!pitchCtx)return;const{cv,ctx}=pitchCtx;const rect=cv.getBoundingClientRect();const W=Math.max(300,rect.width),H=Math.max(240,rect.height);const dpr=Math.min(window.devicePixelRatio||1,1.5);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#08160f';ctx.fillRect(0,0,W,H);const progress=matchRun?.progress||0;const evs=matchRun?.result?.events.filter(e=>e.minute<=progress)||[];const event=evs[evs.length-1];const px=(x,z)=>({x:W*.5+x*W*.37+z*W*.11,y:H*.51+z*H*.26-x*H*.045});const corners=[px(-1,-1),px(1,-1),px(1,1),px(-1,1)];ctx.fillStyle='#122e1e';ctx.beginPath();ctx.moveTo(corners[0].x,corners[0].y);corners.forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill();for(let i=0;i<10;i++){const xa=-1+i*.2,xb=xa+.2;const poly=[px(xa,-1),px(xb,-1),px(xb,1),px(xa,1)];ctx.fillStyle=i%2?'#1f613b':'#246b41';ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);poly.forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill()}ctx.strokeStyle='#d5ebd18f';ctx.lineWidth=1;ctx.beginPath();corners.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();const line=(a,b)=>{const A=px(...a),B=px(...b);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()};line([0,-1],[0,1]);function oval(cx,cz,rx,rz){const pts=[];for(let i=0;i<=60;i++){const a=i/60*Math.PI*2;pts.push(px(cx+Math.cos(a)*rx,cz+Math.sin(a)*rz))}ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}oval(0,0,.18,.25);for(const s of [-1,1]){const x=s*.76;line([x,-.55],[s,-.55]);line([s,-.55],[s,.55]);line([s,.55],[x,.55]);line([s*.88,-.25],[s,-.25]);line([s,-.25],[s,.25]);line([s,.25],[s*.88,.25]);const g1=px(s*1.02,-.13),g2=px(s*1.02,.13);ctx.strokeStyle='#c3d8c6';ctx.strokeRect(g1.x,g1.y-3,g2.x-g1.x,6)}
// crowd dots / floodlight feel
for(let i=0;i<180;i++){const side=i%2?1:-1;ctx.fillStyle=i%4?'#5f8b6d22':'#d8c77919';const p=px(-.95+(i/180)*1.9,side*(1.12+(i%7)*.025));ctx.fillRect(p.x,p.y,2,2)}
const formations=[[-.86,0],[-.57,-.62],[-.58,-.2],[-.58,.2],[-.57,.62],[-.24,0],[-.19,-.43],[-.19,.43],[.28,-.58],[.3,.58],[.54,0]];const awayForm=formations.map(([x,z])=>[-x,-z]);const hclub=state.clubs.find(c=>c.id===getMatchTeams().h.id)||club(),aclub=state.clubs.find(c=>c.id===getMatchTeams().a.id)||club();const hp=currentSquadTop(hclub.id),ap=currentSquadTop(aclub.id);const actors=[];[...hp.slice(0,11).map((p,i)=>({p,x:formations[i][0],z:formations[i][1],team:hclub})),...ap.slice(0,11).map((p,i)=>({p,x:awayForm[i][0],z:awayForm[i][1],team:aclub}))].forEach(({p,x,z,team},i)=>{if(event&&event.playerId===p.id){x=event.x;z=event.z}else if(event&&event.teamId===team.id){x+=event.targetX*.07;z+=event.targetZ*.08}const pt=px(x,z);actors.push({p,pt,team,i});});actors.sort((a,b)=>a.pt.y-b.pt.y);actors.forEach(({p,pt,team,i})=>{ctx.fillStyle='#07110ba0';ctx.beginPath();ctx.ellipse(pt.x,pt.y+7,8,4,0,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(pt.x-2,pt.y-4,1,pt.x,pt.y,11);g.addColorStop(0,team.colors[0]);g.addColorStop(1,team.colors[1]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4f0ce';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ecf4e9';ctx.beginPath();ctx.arc(pt.x,pt.y-6,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9efe9';ctx.font='8px system-ui';ctx.textAlign='center';ctx.fillText(p.position,pt.x,pt.y+17)});let ball=event?px(event.x,event.z):px(Math.sin(performance.now()/1400)*.28,Math.cos(performance.now()/1100)*.18);ctx.fillStyle='#060c08a0';ctx.beginPath();ctx.ellipse(ball.x,ball.y+7,5,2.7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5f3e9';ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#26352b';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(ball.x,ball.y,2,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#e0c779';ctx.font='9px system-ui';ctx.textAlign='left';ctx.fillText('CROWN PARK · 3D-STYLE EVENT VIEW',12,18)}
function startMatch(){const f=currentFixture();if(!f){showToast(tr('noMatch'));return}const h=state.clubs.find(c=>c.id===f.homeClubId),a=state.clubs.find(c=>c.id===f.awayClubId),neutral={formation:'4-3-3',style:'balanced',mentality:'balanced',pressing:50,tempo:50,width:50,defensiveLine:50};const result=simulate(h,a,state.players.filter(p=>p.clubId===h.id),state.players.filter(p=>p.clubId===a.id),h.id===state.currentClubId?state.tactics:neutral,a.id===state.currentClubId?state.tactics:neutral,Date.now());matchRun={fixtureId:f.id,result,progress:0,speed:3,completed:false};page='match';render();initPitch();matchTicker();}
function matchTicker(){clearInterval(canvasTick);canvasTick=setInterval(()=>{if(!matchRun||matchRun.completed){clearInterval(canvasTick);return}matchRun.progress=Math.min(90,matchRun.progress+matchRun.speed*.6);const clock=document.getElementById('sim-clock'),label=document.getElementById('progress-label'),bar=document.getElementById('match-progress-bar'),feed=document.getElementById('event-feed');if(clock)clock.textContent=Math.floor(matchRun.progress)+"'";if(label)label.textContent=Math.floor(matchRun.progress)+' / 90';if(bar)bar.style.width=(matchRun.progress/90*100)+'%';if(feed)feed.innerHTML=renderEvents(matchRun.result,matchRun.progress);if(matchRun.progress>=90){matchRun.completed=true;completeMatch(matchRun.result);render();initPitch();}} ,160);}
function completeMatch(result){const f=state.fixtures.find(f=>f.id===matchRun.fixtureId),c=club();if(!f||f.played)return;const round=state.fixtures.filter(x=>x.season===state.season&&x.round===state.currentRound&&!x.played);for(const fx of round){let res;if(fx.id===f.id)res=result;else{const h=state.clubs.find(x=>x.id===fx.homeClubId),a=state.clubs.find(x=>x.id===fx.awayClubId);res=simulate(h,a,state.players.filter(p=>p.clubId===h.id),state.players.filter(p=>p.clubId===a.id),state.tactics,{formation:'4-3-3',style:'balanced',mentality:'balanced',pressing:50,tempo:50,width:50,defensiveLine:50},(state.day+fx.round)*997+fx.id.length)}fx.played=true;fx.result=res}const isHome=f.homeClubId===c.id;const gf=isHome?result.homeGoals:result.awayGoals,ga=isHome?result.awayGoals:result.homeGoals;const r=rng(result.seed+101);state.players=state.players.map(p=>{if(p.clubId!==c.id)return p;const goals=result.events.filter(e=>e.type==='goal'&&e.playerId===p.id).length,assists=result.events.filter(e=>e.type==='goal'&&e.assistId===p.id).length;return{...p,appearances:p.appearances+(p.injuredWeeks===0?1:0),goals:p.goals+goals,assists:p.assists+assists,fitness:Math.max(32,p.fitness-(p.injuredWeeks===0?9+Math.floor(r()*8):0)),morale:Math.max(15,Math.min(100,p.morale+(gf>ga?5:gf===ga?1:-5))),form:Math.max(-2,Math.min(2,p.form+(gf>ga?1:gf===ga?0:-1))),injuredWeeks:p.injuredWeeks>0?p.injuredWeeks-1:(p.injuredWeeks===0&&r()<.012?1+Math.floor(r()*2):0)}});const income=isHome?Math.round(Math.min(c.capacity,c.supporters*.06)*27*(.86+c.reputation/300)):250000+c.reputation*4500;const sponsor=275000+c.reputation*1700;const wage=wages();c.cash+=income+sponsor-wage;tx(isHome?'Home matchday revenue':'Away match participation',income,'matchday');tx('Weekly sponsor income',sponsor,'sponsor');tx('Weekly squad wages',-wage,'wages');state.day+=7;if(state.currentRound===14){const year=Number(state.season.slice(0,4))+1;state.season=`${year}/${String(year+1).slice(-2)}`;state.fixtures.push(...createFixtures(state.clubs,state.season));state.currentRound=1;updateNews('New season begins',`Welcome to the ${state.season} season.`,'success')}else state.currentRound++;updateNews(gf>ga?'Matchday victory':gf===ga?'Matchday draw':'A tough matchday',`${f.date} · ${isHome?c.shortName+' '+gf+'–'+ga:ga+'–'+gf+' '+c.shortName}. League and finances updated.`,gf>ga?'success':gf===ga?'info':'warning');persist();}
function upgrade(key){const c=club(),l=state.facilities[key],cost=[0,1500000,2750000,4500000,7000000,0][l+1];if(l>=5||c.cash<cost){showToast(tr('error'),l>=5?'Maximum level reached':'Insufficient cash','error');return}const nm={training:'Training ground',academy:'Youth academy',medical:'Medical centre',scouting:'Scouting network',stadium:'Stadium'};state.facilities[key]++;c.cash-=cost;tx(nm[key]+' upgrade',-cost,'facility');updateNews('Facility upgraded',`${nm[key]} reached level ${state.facilities[key]}.`,'success');persist();render();showToast(tr('success'),`${nm[key]} upgraded.`)}
function doScout(id){const p=state.players.find(p=>p.id===id),c=club();if(!p)return;if(state.scoutingReports.some(r=>r.playerId===id)){showToast(tr('report'),tr('reportReady'));return}const cost=75000*Math.max(1,1.15-state.facilities.scouting*.05);if(c.cash<cost){showToast(tr('error'),'Insufficient cash','error');return}const accuracy=Math.min(96,55+state.facilities.scouting*7+Math.floor(Math.random()*12));const potential=Math.max(p.overall,Math.min(96,Math.round(p.potential+(Math.random()-.5)*(100-accuracy)*.35)));c.cash-=cost;tx(`Scouting report: ${p.name}`,-cost,'other');state.scoutingReports.push({playerId:id,potential,accuracy});updateNews('Scouting report delivered',`${p.name} · ${accuracy}% confidence.`,'info');persist();render();showToast(tr('success'),tr('reportReady'))}
function offer(id,amount){const p=state.players.find(p=>p.id===id),c=club();if(!p||p.clubId===c.id)return{ok:false,msg:'Player unavailable'};if(roster().length>=30)return{ok:false,msg:'Squad limit reached (30 players).'};if(wages()+p.wage>c.wageBudget)return{ok:false,msg:'Weekly wage budget exceeded.'};const free=p.clubId==='free-agent',fee=free?0:Math.max(0,Math.round(amount)),seller=state.clubs.find(x=>x.id===p.clubId);if(!free&&(fee>c.cash||fee>c.transferBudget))return{ok:false,msg:'Insufficient transfer budget.'};const threshold=p.value*(seller?(0.8+(seller.reputation||0)/650):0);if(!free&&fee<threshold)return{ok:false,msg:'Offer rejected. Try at least '+money(Math.round(p.value*1.04/50000)*50000)+'.',counter:Math.round(p.value*1.04/50000)*50000};if(!free&&seller&&fee<p.value*.94&&Math.random()<.25)return{ok:false,msg:'Selling club requests a higher fee.',counter:Math.round(p.value*1.08/50000)*50000};if(!free&&seller){seller.cash+=fee;seller.transferBudget+=Math.round(fee*.45)}c.cash-=fee;c.transferBudget-=fee;p.clubId=c.id;p.contractYears=Math.max(2,p.contractYears);p.morale=Math.min(100,p.morale+5);if(fee)tx(`Transfer: ${p.name}`,-fee,'transfer');updateNews('Transfer completed',`${p.name} joined ${c.name} for ${fee?money(fee):'a free transfer'}.`,'success');persist();return{ok:true,msg:p.name+' has joined the club.'}}
function sellPlayer(id){const p=state.players.find(p=>p.id===id),c=club();if(!p||p.clubId!==c.id)return{ok:false,msg:'Player not found'};if(roster().length<=18)return{ok:false,msg:'Keep at least 18 first-team players.'};const buyer=state.clubs.filter(x=>x.id!==c.id).sort((a,b)=>b.cash-a.cash)[0],fee=Math.round(p.value*.82/50000)*50000;if(!buyer)return{ok:false,msg:'No buyer available'};p.clubId=buyer.id;c.cash+=fee;c.transferBudget+=Math.round(fee*.75);buyer.cash-=fee;tx('Player sale: '+p.name,fee,'transfer');updateNews('Transfer completed',`${p.name} sold for ${money(fee)}.`,'success');persist();return{ok:true,msg:`Sold ${p.name} for ${money(fee)}.`}}
function train(){const c=club(),cost=120000+state.facilities.training*35000;if(c.cash<cost){showToast(tr('error'),'Insufficient cash','error');return}c.cash-=cost;state.players.forEach(p=>{if(p.clubId===c.id){p.fitness=Math.min(100,p.fitness+8+state.facilities.training);p.morale=Math.min(100,p.morale+2);p.form=Math.min(2,p.form+1);if(p.age<25&&p.overall<p.potential&&Math.random()<.08)p.overall++}});tx('First-team training camp',-cost,'other');updateNews('Training camp completed','Fitness and morale improved across the squad.','success');persist();render();showToast(tr('success'),tr('train'))}
function signYouth(){const c=club(),cost=250000;if(c.cash<cost){showToast(tr('error'),'Insufficient cash','error');return}const r=rng(Date.now()),y=player('youth-'+Date.now(),c.id,state.players.length,r,c.reputation-15,true);y.wage=Math.max(250,Math.round(y.wage*.38));y.value=Math.round(y.value*.55);state.players.push(y);c.cash-=cost;tx('Youth signing: '+y.name,-cost,'academy');updateNews('New academy prospect',`${y.name}, ${y.age}, entered the youth pathway.`,'success');persist();render();showToast(tr('success'),y.name+' joined the squad pathway.')}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`crown-of-football-${state.season.replace('/','-')}-save.json`;a.click();URL.revokeObjectURL(url);showToast(tr('saved'),'Career backup exported.')}
function importSave(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(String(reader.result));if(d.saveVersion!==1||!Array.isArray(d.clubs)||!Array.isArray(d.players)||!Array.isArray(d.fixtures)||!d.currentClubId)throw new Error('Unsupported save format');if(!d.clubs.some(c=>c.id===d.currentClubId))throw new Error('Missing current club');state=d;persist();render();showToast(tr('success'),'Career restored.')}catch(e){showToast(tr('error'),e.message||'Invalid save','error')}};reader.readAsText(file)}
function resetCareer(){if(confirm('Start a new career? This replaces the current browser save.')){state=fresh();matchRun=null;page='dashboard';persist();render();showToast(tr('success'),'Fresh career created.')}}
function handleClick(e){const b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();if(page==='match')initPitch();return}const act=b.dataset.action;if(!act)return;if(act==='open-menu'){document.getElementById('sidebar')?.classList.add('open');document.querySelector('.nav-overlay')?.classList.remove('hidden')}if(act==='close-menu'){document.getElementById('sidebar')?.classList.remove('open');document.querySelector('.nav-overlay')?.classList.add('hidden')}if(act==='cycle-lang'){locale=locale==='fa'?'en':locale==='en'?'zh':'fa';localStorage.setItem('crown-locale',locale);render()}if(act==='goto-match'){startMatch()}if(act==='goto-transfers'){page='transfers';render()}if(act==='train')train();if(act==='play-match'){if(matchRun?.completed){matchRun=null;render();initPitch()}else startMatch()}if(act.startsWith('speed:')){if(matchRun){matchRun.speed=Number(act.split(':')[1]);render();initPitch();matchTicker()}}if(act.startsWith('offer:')){offerId=act.split(':')[1];const p=state.players.find(p=>p.id===offerId);offerAmount=p?.clubId==='free-agent'?0:Math.round(p.value*1.02/50000)*50000;render()}if(act==='cancel-offer'){offerId=null;render()}if(act==='modal-back'&&e.target===b){offerId=null;render()}if(act.startsWith('offer-pct:')){const p=state.players.find(p=>p.id===offerId);if(p){offerAmount=Math.round(p.value*(Number(act.split(':')[1])/100)/50000)*50000;document.getElementById('offer-amount').value=offerAmount}}if(act.startsWith('sell:')){const p=state.players.find(x=>x.id===act.split(':')[1]);if(p&&confirm(`${tr('sell')} ${p.name}?`)){const r=sellPlayer(p.id);render();showToast(r.ok?tr('success'):tr('error'),r.msg,r.ok?'success':'error')}}if(act.startsWith('scout:'))doScout(act.split(':')[1]);if(act.startsWith('upgrade:'))upgrade(act.split(':')[1]);if(act==='sign-youth')signYouth();if(act.startsWith('formation:')){state.tactics.formation=act.split(':')[1];persist();render()}if(act.startsWith('style:')){state.tactics.style=act.split(':')[1];persist();render()}if(act.startsWith('mentality:')){state.tactics.mentality=act.split(':')[1];persist();render()}if(act==='save-tactics'){persist();showToast(tr('saved'),tr('saveTactics'))}if(act.startsWith('dismiss:')){state.news=state.news.filter(n=>n.id!==act.slice(8));persist();render()}if(act.startsWith('lang:')){locale=act.split(':')[1];localStorage.setItem('crown-locale',locale);render()}if(act==='export')exportSave();if(act==='import')document.getElementById('import-file')?.click();if(act==='reset')resetCareer()}
function handleChange(e){const el=e.target;if(el.id==='player-search'){query=el.value;const rows=document.getElementById('squad-rows');if(rows)rows.innerHTML=squadRows()}if(el.id==='market-search'){query=el.value;const pos=document.getElementById('market-position')?.value||'ALL';filterPos=pos;const scroll=window.scrollY;render();window.scrollTo(0,scroll)}if(el.id==='position-filter'){filterPos=el.value;render()}if(el.id==='market-filter'){marketFilter=el.value;render()}if(el.id==='market-position'){filterPos=el.value;render()}if(el.dataset.tactic){state.tactics[el.dataset.tactic]=Number(el.value);const label=el.previousElementSibling?.querySelector('b');if(label)label.textContent=el.value;persist()}if(el.id==='import-file'&&el.files?.[0]){importSave(el.files[0]);el.value=''}}
function handleInput(e){const el=e.target;if(el.id==='market-search'){query=el.value;const p=el.selectionStart;const container=el.closest('.toolbar');if(container){const old=window.scrollY;const pageEl=document.querySelector('.page');if(pageEl){const market=marketPlayers();const grid=document.querySelector('.marketgrid');if(grid){grid.innerHTML=market.slice(0,42).map((p,i)=>{const seller=state.clubs.find(c=>c.id===p.clubId);const rep=state.scoutingReports.find(r=>r.playerId===p.id);const afford=p.clubId==='free-agent'||p.value<=club().transferBudget;return `<div class="market-card"><div class="market-top"><div class="avatar">${initials(p.name)}</div><span class="pos">${p.position}</span><span class="rank">${String(i+1).padStart(2,'0')}</span></div><h3>${esc(p.name)}</h3><div class="sub">${p.nationality} · ${p.age} y/o</div><div class="ratings"><div><span>OVR</span><b>${p.overall}</b></div><div><span>POT</span><b class="${rep?'good':'muted'}">${rep?rep.potential:'??'}</b></div><div><span>FIT</span><b>${p.fitness}%</b></div></div><div class="market-value"><div><small>${tr('marketValue')}</small><strong>${p.clubId==='free-agent'?tr('free'):money(p.value)}</strong></div><span class="muted">${seller?.shortName||tr('free')}</span></div><div style="display:flex;gap:6px">${btn(p.clubId==='free-agent'?tr('sign'):tr('offer'),'offer:'+p.id,'green',!afford||wages()+p.wage>club().wageBudget?'disabled':'')}<button class="btn outline" data-action="scout:${p.id}">⌕</button></div></div>`}).join('')}}window.scrollTo(0,old);el.focus();el.setSelectionRange(p,p)}}}
app.addEventListener('click',handleClick);app.addEventListener('change',handleChange);app.addEventListener('input',handleInput);app.addEventListener('submit',e=>{if(e.target.id==='offer-form'){e.preventDefault();const id=offerId,amount=Number(document.getElementById('offer-amount').value);const result=offer(id,amount);if(result.ok){offerId=null;render();showToast(tr('success'),result.msg)}else{showToast(tr('error'),result.msg,'error');if(result.counter){offerAmount=result.counter;document.getElementById('offer-amount').value=result.counter}}}});window.addEventListener('resize',()=>{if(page==='match')drawPitch()});render();
})();
</script></body></html>
